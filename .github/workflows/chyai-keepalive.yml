# Keeps the free Render services (ChyAI backend + site) awake. Render free web services sleep after ~15 min idle.
# GitHub may delay scheduled runs (sometimes 10–30+ min) — acceptable; public repo → Actions minutes are free.
name: chyai-keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: chyai-keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        run: |
          code=$(curl -sS -o /tmp/h.json -w '%{http_code}' --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://agentpad-api.onrender.com/v1/health || echo 000)
          echo "backend /v1/health -> $code"; head -c 300 /tmp/h.json || true; echo
          test "$code" = "200"
      - name: Ping site
        if: always()
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://chyai.onrender.com || echo 000)
          echo "site -> $code"
          test "$code" = "200"
