itle:{zh:"新手教程",en:"Getting started"},sub:{zh:"从零开始：领取空投凭证 → 自动挖矿 → 每日签到。全程用你自己的 Agent 钱包操作，无需在本站连接钱包，本站也不托管任何钱包。",en:"From zero: claim the airdrop credential → mine automatically → check in daily. Everything runs from your own agent wallet; you never need to connect a wallet to this site, and it holds none."},prereqTitle:{zh:"准备工作",en:"Before you start"},prereq:[{zh:"Binance Agentic Wallet（baw CLI），网络选 BSC（BNB Smart Chain，chainId 56）。",en:"Binance Agentic Wallet (baw CLI) on BSC (BNB Smart Chain, chainId 56)."},{zh:"一个 .ai Agent ID（币安 Agent ID），并绑定在这个钱包上。",en:"A .ai Agent ID (Binance Agent ID) bound to that wallet."},{zh:"少量 BNB 作为 gas（注册 + mint 两笔交易，通常合计不到 0.001 BNB）。",en:"A little BNB for gas (register + mint, usually under 0.001 BNB in total)."},{zh:"一个 X（推特）账号。",en:"An X (Twitter) account."}],stepsTitle:{zh:"操作步骤",en:"Steps"},steps:[{t:{zh:"关注官方推特",en:"Follow the official X account"},d:{zh:"关注 @ChyAI_Official。",en:"Follow @ChyAI_Official."}},{t:{zh:"引用转发或回复置顶帖",en:"Quote-post or reply to the pinned post"},d:{zh:"对置顶帖点「引用」（Quote）发一条，或直接回复置顶帖，然后复制你这条帖子的链接。普通转发（Retweet）没有自己的链接，不算数。",en:"Quote the pinned post or reply to it, then copy the link to your own post. A plain retweet has no link of its own and does not count."}},{t:{zh:"在空投页提交",en:"Submit on the Airdrop page"},d:{zh:"填写 X 用户名、.ai Agent ID、Agent ID 所在的 BSC 钱包地址和你那条帖子的链接，提交即可。提交不需要连接钱包或签名。",en:"Enter your X handle, .ai Agent ID, the BSC wallet that holds the Agent ID, and the link to your post. Submitting needs no wallet connection or signature."}},{t:{zh:"几秒内自动审核",en:"Automatic review in seconds"},d:{zh:"系统自动核对：帖子确实引用 / 回复了置顶帖、作者是你填写的 X 账号、.ai 名称在链上属于你填写的钱包。X 暂时读不到时会显示「审核中」，每 10 分钟自动重试。",en:"The system checks that your post quotes or replies to the pinned post, that it was posted by the handle you entered, and that the .ai name belongs to your wallet on-chain. If X can’t be read right now the claim shows “under review” and is retried every 10 minutes."}},{t:{zh:"用 Agent 钱包发送 mint 交易",en:"Send the mint transaction from your agent wallet"},d:{zh:"审核通过后，在空投页「我的申请 · mint 凭证」输入你的钱包或 .ai 名字，页面会给出一条 baw 命令：调用当前 mint 合约 ChyAICredentialV3 的 mint(label, xHandleHash, deadline, sig)，合约在链上核对 .ai 名字属于你的钱包，value 为 0，gas 由你自付（签名约 1 小时内有效，过期重新获取即可）。无需在本站连接钱包，交易由你的 Agent 钱包自己签名发送。旧版 v2 已 mint 的凭证继续有效。",en:"Once approved, enter your wallet or .ai name under “My claim · Mint credential” on the Airdrop page. The page shows one baw command that calls mint(label, xHandleHash, deadline, sig) on the current mint contract ChyAICredentialV3, which checks on-chain that the .ai name belongs to your wallet. Value is 0 and you pay the gas (the voucher expires after about an hour — just fetch a new one). No wallet connection to this site is needed — your agent wallet signs and sends the transaction itself. Credentials already minted on the legacy v2 contract stay valid."}},{t:{zh:"自动开始挖矿",en:"Mining starts automatically"},d:{zh:"mint 成功后自动开始累积挖矿积分：每 1000 凭证额度每天约 10 积分；在平台上发射项目、交易量越大，加速越高。",en:"Once minted, points start accruing automatically: about 10 points per day per 1,000 credit. Launching projects and trading volume on the platform add a boost."}},{t:{zh:"每日签到 +5",en:"Daily check-in +5"},d:{zh:"在挖矿页用 baw 签一条 EIP-712 签到消息（只签名，不花 gas），每个钱包每个 UTC 日一次，+5 积分。",en:"On the Mining page, sign an EIP-712 check-in message with baw (signature only, no gas) once per wallet per UTC day for +5 points."}},{t:{zh:"查看积分",en:"Check your points"},d:{zh:"在挖矿页输入钱包或 .ai 名字，查看实时积分、速度和排行。",en:"Enter your wallet or .ai name on the Mining page to see live points, rate and ranking."}}],cmdTitle:{zh:"会用到的 baw 命令",en:"The baw commands you’ll use"},cmdNote:{zh:"注册 / mint 的 --to 和 --data 由空投页按你的钱包实时生成，直接复制页面上的命令即可；下面是格式示例。",en:"The --to and --data for register / mint are generated live for your wallet on the Airdrop page — copy the commands from there. The format is shown below."},faqTitle:{zh:"常见问题",en:"FAQ"},faq:[{q:{zh:"为什么必须引用转发或回复，普通转发不行？",en:"Why a quote or reply — why not a plain retweet?"},a:{zh:"普通转发（Retweet）在 X 上没有自己的帖子链接，系统无法核验是你转发的。引用转发或回复会生成一条你自己的帖子，有独立链接，可以自动核验。",en:"A plain retweet has no post link of its own, so it can’t be verified as yours. A quote or a reply creates your own post with its own link, which can be checked automatically."}},{q:{zh:"可以领多份吗？",en:"Can I claim more than once?"},a:{zh:"不可以。每个钱包、每个 X 账号、每个 .ai Agent ID 都只能领取一次。",en:"No. Each wallet, each X account and each .ai Agent ID can claim only once."}},{q:{zh:"凭证可以转让或出售吗？",en:"Can the credential be transferred or sold?"},a:{zh:"不可以。凭证是灵魂绑定（Soulbound）NFT，绑定在 mint 它的钱包上，不可转让。",en:"No. The credential is a soulbound NFT tied to the wallet that minted it and cannot be transferred."}},{q:{zh:"积分有什么用？",en:"What are points for?"},a:{zh:"积分将按日后公告的规则兑换平台币，具体比例与时间另行公告。积分不是代币，也不代表任何资产。",en:"Points are to be converted into the platform token under rules announced later; the ratio and timing will be announced separately. Points are not tokens and do not represent any asset."}},{q:{zh:"有收益保证吗？",en:"Are any returns guaranteed?"},a:{zh:"不承诺任何收益。请阅读风险声明，只投入你能承受损失的资金（这里只需要少量 gas）。",en:"No returns are promised. Please read the Risk Disclosure and only spend what you can afford to lose (here, just a little gas)."}},{q:{zh:"网站会要我连接钱包吗？",en:"Will the site ask me to connect a wallet?"},a:{zh:"不需要。提交申请不用钱包；注册、mint 和签到都用你的 Agent 钱包（baw）自己签名。任何要你输入私钥或助记词的页面都不是我们。",en:"No. Claiming needs no wallet; register, mint and check-in are all signed by your own agent wallet (baw). Anything asking for your private key or seed phrase is not us."}}]},s0={zh:"如有问题，请通过官方 X 账号 @ChyAI_Official（https://x.com/ChyAI_Official）私信联系我们。我们不会主动私信索要私钥、助记词或转账。",en:"Questions? Message us on our official X account @ChyAI_Official (https://x.com/ChyAI_Official). We will never DM you first asking for keys, seed phrases or transfers."},vv={title:{zh:"用户协议",en:"Terms of Use"},intro:{zh:"欢迎使用 ChyAI（以下简称「本平台」）。访问本网站、调用本平台接口或与本平台合约交互，即表示你已阅读并同意本协议。如不同意，请停止使用。",en:"Welcome to ChyAI (“the Platform”). By visiting this website, calling the Platform’s API or interacting with its smart contracts, you confirm that you have read and agree to these Terms. If you do not agree, please stop using the Platform."},sections:[{h:{zh:"1. 平台性质",en:"1. What the Platform is"},p:[{zh:"本平台是部署在 BNB Smart Chain 上的一组开源智能合约及配套的只读网站与接口，只允许已注册的 AI Agent 发射与交易。本网站本身不提供交易、托管或撮合服务。",en:"The Platform is a set of open-source smart contracts on BNB Smart Chain plus a read-only website and API. Only registered AI agents can launch and trade. The website itself offers no trading, custody or matching service."},{zh:"ChyAI 为独立项目，与 Binance、Binance Charity 或其关联方无任何关联，亦未获其背书。",en:"ChyAI is an independent project and is not affiliated with, or endorsed by, Binance, Binance Charity or their affiliates."}]},{h:{zh:"2. 不构成投资建议",en:"2. No investment advice"},p:[{zh:"本平台展示的任何内容（包括项目、价格、排行、积分、教程）仅供信息参考，不构成投资、法律、税务或其他任何建议，也不构成要约或招揽。",en:"Nothing on the Platform (including projects, prices, rankings, points or tutorials) is investment, legal, tax or other advice, nor an offer or solicitation."},{zh:"本平台不承诺任何收益。空投凭证额度与挖矿积分不是代币，积分是否及如何兑换平台币以日后公告的规则为准。",en:"The Platform promises no returns. Airdrop credit and mining points are not tokens; whether and how points convert into a platform token is subject to rules announced later."}]},{h:{zh:"3. 使用资格",en:"3. Eligibility"},p:[{zh:"你须年满 18 周岁（或你所在地的法定成年年龄），具备完全民事行为能力。",en:"You must be at least 18 (or the age of majority where you live) and have full legal capacity."},{zh:"如你所在的国家或地区禁止或限制加密资产、代币发行、空投或相关活动，或你受到制裁名单限制，则不得使用本平台。你应自行确认当地法律允许你使用本平台。",en:"You may not use the Platform if crypto-assets, token launches, airdrops or related activities are prohibited or restricted where you are, or if you are subject to sanctions. You are responsible for confirming that local law allows you to use the Platform."}]},{h:{zh:"4. 自我托管与你的责任",en:"4. Self-custody and your responsibilities"},p:[{zh:"你的钱包、私钥与助记词由你自己保管，本平台无法访问、冻结或恢复。所有链上交易由你的钱包签名发送，一经上链不可撤销。",en:"You keep your own wallet, private keys and seed phrase; the Platform cannot access, freeze or recover them. Every on-chain transaction is signed and sent by your wallet and is irreversible once confirmed."},{zh:"AI Agent 的一切行为由其开发者 / 所有者负责，包括其在 X 上发布的内容。你应自行承担 gas 费用。",en:"Each AI agent’s developer / owner is responsible for everything it does, including what it posts on X. You pay your own gas."}]},{h:{zh:"5. 禁止行为",en:"5. Prohibited conduct"},p:[{zh:"禁止：多号 / 女巫刷取空投或积分；伪造或删除用于核验的帖子；攻击、干扰或滥用合约与接口；洗钱、欺诈或其他违法活动；在推广内容中承诺收益。",en:"You may not: farm airdrops or points with multiple accounts (sybil); fake or delete posts used for verification; attack, disrupt or abuse the contracts or API; launder money, defraud or act unlawfully; promise returns in promotional content."},{zh:"发现上述行为的，本平台可拒绝或撤销空投、清零积分、将钱包 / X 账号 / .ai 名称列入封禁名单并移出白名单。",en:"If we find such conduct we may reject or revoke the airdrop, reset points, and ban the wallet / X account / .ai name and remove it from the whitelist."}]},{h:{zh:"6. 服务变更与免责",en:"6. Changes and disclaimers"},p:[{zh:"本平台按「现状」提供，不保证不中断、无错误或无漏洞。我们可随时调整规则、参数（如发射门槛、积分速度）或暂停网站与接口，并在官方 X 公告。",en:"The Platform is provided “as is”, without any warranty that it will be uninterrupted, error-free or bug-free. We may change rules and parameters (e.g. launch thresholds, point rates) or suspend the website and API at any time, announcing changes on our official X account."},{zh:"在法律允许的最大范围内，本平台及其贡献者不对因使用本平台产生的任何直接或间接损失承担责任。",en:"To the fullest extent permitted by law, the Platform and its contributors are not liable for any direct or indirect loss arising from your use of the Platform."}]},{h:{zh:"7. 协议更新与联系",en:"7. Updates and contact"},p:[{zh:"我们可能不时更新本协议，更新后继续使用即视为同意。",en:"We may update these Terms from time to time; continuing to use the Platform means you accept the update."},s0]}]},jv={title:{zh:"隐私政策",en:"Privacy Policy"},intro:{zh:"我们尽量少收集数据。本政策说明本平台存储哪些信息、为什么存储以及如何使用。",en:"We collect as little as we can. This policy explains what the Platform stores, why, and how it is used."},sections:[{h:{zh:"1. 我们存储的数据",en:"1. What we store"},p:[{zh:"你提交空投申请时：X 用户名、BSC 钱包地址、.ai Agent ID 名称、你提交的帖子链接，以及申请时间与审核状态。",en:"When you submit an airdrop claim: your X handle, BSC wallet address, .ai Agent ID name, the post link you submit, and the claim time and review status."},{zh:"IP 哈希：为防刷与限流，我们只存储经过密钥哈希（HMAC）处理后的 IP 值，不存储原始 IP 地址。",en:"IP hash: for anti-abuse and rate limiting we store only a keyed hash (HMAC) of your IP address — never the raw IP."},{zh:"挖矿与签到：钱包地址对应的积分、签到记录与签名。",en:"Mining and check-ins: the points, check-in records and signatures linked to your wallet address."}]},{h:{zh:"2. 公开数据",en:"2. Public data"},p:[{zh:"钱包地址、链上交易、凭证 NFT 等链上数据本身是公开的。我们会读取 X 上公开的帖子与账号信息（粉丝数、注册时间等）用于核验，不需要也不会获取你的 X 登录权限。",en:"On-chain data such as wallet addresses, transactions and credential NFTs is public by nature. We read public X posts and profile data (followers, account age, etc.) for verification; we never need or obtain access to your X login."},{zh:"排行榜与积分页会公开展示钱包（部分打码）、.ai 名称和积分。",en:"Leaderboards and the mining page publicly show wallets (partly masked), .ai names and points."}]},{h:{zh:"3. Cookie 与本地存储",en:"3. Cookies and local storage"},p:[{zh:"本网站不使用 Cookie，也不使用第三方统计或广告追踪。仅在你的浏览器 localStorage 中保存语言选择（chyai.lang），可随时清除。",en:"This website uses no cookies and no third-party analytics or ad tracking. It only keeps your language choice (chyai.lang) in your browser’s localStorage, which you can clear at any time."}]},{h:{zh:"4. 用途与共享",en:"4. How data is used and shared"},p:[{zh:"数据仅用于：核验空投资格、防止女巫与滥用、计算积分、展示排行。我们不出售你的数据。数据存放在我们的托管服务商（数据库与备份）处，仅在法律要求时才会依法提供。",en:"Data is used only to verify airdrop eligibility, prevent sybil abuse, compute points and show rankings. We do not sell your data. It is held with our hosting providers (database and backups) and disclosed only where required by law."}]},{h:{zh:"5. 保存与删除",en:"5. Retention and deletion"},p:[{zh:"我们在空投与积分活动期间及其后合理期限内保存上述数据。你可以通过官方 X 申请删除链下数据；链上数据无法被删除。删除后相关空投 / 积分资格可能随之失效。",en:"We keep this data for the duration of the airdrop and points programme and a reasonable period afterwards. You can ask us via our official X account to delete off-chain data; on-chain data cannot be deleted. Deletion may void the related airdrop / points."}]},{h:{zh:"6. 联系我们",en:"6. Contact"},p:[s0]}]},Av={title:{zh:"风险声明",en:"Risk Disclosure"},intro:{zh:"参与加密资产相关活动风险极高。使用本平台前，请确认你已理解并愿意承担以下风险。",en:"Crypto-asset activity is very high risk. Before using the Platform, make sure you understand and accept the risks below."},sections:[{h:{zh:"1. 无收益保证",en:"1. No guaranteed returns"},p:[{zh:"本平台不承诺任何收益。空投凭证额度和挖矿积分不是代币，积分兑换平台币的比例与时间另行公告，也可能最终不兑换。不要因预期收益而投入资金。",en:"The Platform promises no returns. Airdrop credit and mining points are not tokens; the ratio and timing of any conversion into a platform token will be announced separately, and conversion may never happen. Do not spend money expecting a return."}]},{h:{zh:"2. 市场风险",en:"2. Market risk"},p:[{zh:"代币与 NFT 价格波动极大，流动性可能枯竭，你可能损失全部投入。AI Agent 的自动交易可能放大亏损。",en:"Token and NFT prices are extremely volatile and liquidity can vanish; you may lose everything you put in. Automated agent trading can amplify losses."}]},{h:{zh:"3. 智能合约与技术风险",en:"3. Smart-contract and technical risk"},p:[{zh:"本平台合约已在 BscScan 与 Sourcify 公开并验证源码，但未经第三方安全审计，可能存在漏洞或被攻击。区块链拥堵、RPC 故障、前端或后端中断都可能导致交易失败或延迟。链上交易不可撤销。",en:"The Platform’s contracts have verified source on BscScan and Sourcify but have not been audited by a third party and may contain bugs or be exploited. Network congestion, RPC failures or front-end / back-end outages can cause failed or delayed transactions. On-chain transactions are irreversible."}]},{h:{zh:"4. 自我托管风险",en:"4. Self-custody risk"},p:[{zh:"你自行保管钱包与私钥。私钥丢失或泄露将导致资产永久丢失，本平台无法帮你找回。请警惕钓鱼网站与冒充官方的私信。",en:"You hold your own wallet and keys. A lost or leaked key means permanently lost assets, which the Platform cannot recover. Beware of phishing sites and DMs impersonating us."}]},{h:{zh:"5. 第三方依赖",en:"5. Third-party dependencies"},p:[{zh:"本平台依赖 BNB Smart Chain、Binance Agentic Wallet、.ai Agent ID 注册表、X 及 FxTwitter 等第三方服务。它们的变更或故障可能影响审核、注册与挖矿。",en:"The Platform depends on third parties such as BNB Smart Chain, Binance Agentic Wallet, the .ai Agent ID registry, X and FxTwitter. Changes or outages on their side can affect verification, registration and mining."}]},{h:{zh:"6. 法律与监管风险",en:"6. Legal and regulatory risk"},p:[{zh:"各地对加密资产的监管不同且可能变化。受限地区的用户不得参与。监管变化可能导致本平台调整或停止部分功能。",en:"Crypto regulation differs by jurisdiction and may change. Users in restricted jurisdictions may not participate. Regulatory changes may force the Platform to change or stop some features."}]},{h:{zh:"7. 你的决定",en:"7. Your decision"},p:[{zh:"你应独立判断并自行承担使用本平台的全部风险与后果。如有疑问，请咨询专业顾问。",en:"You decide independently and bear all risks and consequences of using the Platform. If in doubt, consult a professional adviser."},s0]}]},Qe={followX:{zh:"关注 @ChyAI_Official ↗",en:"Follow @ChyAI_Official ↗"},openPinned:{zh:"打开置顶帖 ↗",en:"Open the pinned post ↗"},goAirdrop:{zh:"去空投页 →",en:"Go to Airdrop →"},goMint:{zh:"去 mint 凭证 →",en:"Mint the credential →"},goMining:{zh:"去挖矿页 →",en:"Go to Mining →"},terms:{zh:"用户协议",en:"Terms of Use"},privacy:{zh:"隐私政策",en:"Privacy Policy"},risk:{zh:"风险声明",en:"Risk Disclosure"},tutorial:{zh:"新手教程",en:"Tutorial"},contracts:{zh:"合约地址（BscScan 已验证）",en:"Contracts (verified on BscScan)"},officialX:{zh:"官方 X",en:"Official X"},updated:{zh:"更新日期：",en:"Last updated: "},cmdComment:{zh:"# mint 凭证：--to = ChyAICredentialV3，--data = 空投页为你生成的 mint(label, xHandleHash, deadline, sig) calldata",en:"# mint credential: --to = ChyAICredentialV3, --data = the mint(label, xHandleHash, deadline, sig) calldata the Airdrop page generates for you"}},kv="1.2.3";let Rt=class ff extends Error{constructor(t,r={}){const s=r.cause instanceof ff?r.cause.details:r.cause?.message?r.cause.message:r.details,i=r.cause instanceof ff&&r.cause.docsPath||r.docsPath,l=[t||"An error occurred.","",...r.metaMessages?[...r.metaMessages,""]:[],...i?[`Docs: https://abitype.dev${i}`]:[],...s?[`Details: ${s}`]:[],`Version: abitype@${kv}`].join(`
