done by an AI agent (Binance Agentic Wallet / baw) — clicking on the website alone never mints a credential and never starts mining. Easiest: copy the one-command prompt from the Airdrop page to your AI agent."},prereqTitle:{zh:"准备工作",en:"Before you start"},prereq:[{zh:"Binance Agentic Wallet（baw CLI），网络选 BSC（BNB Smart Chain，chainId 56）。",en:"Binance Agentic Wallet (baw CLI) on BSC (BNB Smart Chain, chainId 56)."},{zh:"一个 .ai Agent ID（币安 Agent ID），并绑定在这个钱包上。",en:"A .ai Agent ID (Binance Agent ID) bound to that wallet."},{zh:"少量 BNB 作为 gas（一笔 mint 交易，约 20 万 gas，通常不到 0.0001 BNB）。",en:"A little BNB for gas (one mint transaction, ~200k gas, usually under 0.0001 BNB)."},{zh:"一个 X（推特）账号。",en:"An X (Twitter) account."},{zh:"一个能运行 baw CLI 的 AI Agent，并在 Binance App 里打开开发者模式（Developer Mode）。",en:"An AI agent that can run the baw CLI, with Developer Mode enabled in the Binance App."}],stepsTitle:{zh:"操作步骤",en:"Steps"},steps:[{t:{zh:"关注官方推特",en:"Follow the official X account"},d:{zh:"关注 @ChyAI_Official。",en:"Follow @ChyAI_Official."}},{t:{zh:"引用转发或回复置顶帖",en:"Quote-post or reply to the pinned post"},d:{zh:"对置顶帖点「引用」（Quote）发一条，或直接回复置顶帖，然后复制你这条帖子的链接。普通转发（Retweet）没有自己的链接，不算数。",en:"Quote the pinned post or reply to it, then copy the link to your own post. A plain retweet has no link of its own and does not count."}},{t:{zh:"把一条指令交给 AI Agent",en:"Give your AI agent the one-command prompt"},d:{zh:"在空投页复制「交给 AI Agent 一条指令跑完全流程」，填上你的 X 用户名和帖子链接，发给装有 Binance Agentic Wallet 的 AI Agent。Agent 会代你提交申请（也可以在网页表单手动提交，重复提交会直接返回已有状态）。",en:"On the Airdrop page, copy “Give your AI agent one command to run the whole flow”, fill in your X handle and post link, and send it to an AI agent that has the Binance Agentic Wallet. The agent submits the claim for you (you can also use the web form; repeat submissions just return your existing claim)."}},{t:{zh:"几秒内自动审核",en:"Automatic review in seconds"},d:{zh:"系统自动核对：帖子确实引用 / 回复了置顶帖、作者是你填写的 X 账号、.ai 名称在链上属于你填写的钱包。X 暂时读不到时会显示「审核中」，每 10 分钟自动重试。",en:"The system checks that your post quotes or replies to the pinned post, that it was posted by the handle you entered, and that the .ai name belongs to your wallet on-chain. If X can’t be read right now the claim shows “under review” and is retried every 10 minutes."}},{t:{zh:"Agent 用 baw 发送 mint 交易（已通过 ≠ 已有凭证）",en:"The agent sends the mint with baw (approved ≠ credential)"},d:{zh:"「已通过」只代表申请通过，还没有凭证。Agent 取 /v1/airdrop/voucher 返回的 mint 交易，用 baw 先 preview、你确认后 execute（如需要，在 Binance App 里批准）。也可以在空投页「我的申请 · mint 凭证」查看同一条 baw 命令：调用当前 mint 合约 ChyAICredentialV3 的 mint(label, xHandleHash, deadline, sig)，合约在链上核对 .ai 名字属于你的钱包，value 为 0，gas 由你自付（签名约 1 小时内有效，过期重新获取即可）。无需在本站连接钱包，交易由你的 Agent 钱包自己签名发送。旧版 v2 已 mint 的凭证继续有效。",en:"“Approved” only means the claim passed — there is no credential yet. The agent fetches the mint transaction from /v1/airdrop/voucher and runs it with baw: preview first, execute after you confirm (approve in the Binance App if asked). The same baw command is shown under “My claim · Mint credential”  on the Airdrop page; it calls mint(label, xHandleHash, deadline, sig) on the current mint contract ChyAICredentialV3, which checks on-chain that the .ai name belongs to your wallet. Value is 0 and you pay the gas (the voucher expires after about an hour — just fetch a new one). No wallet connection to this site is needed — your agent wallet signs and sends the transaction itself. Credentials already minted on the legacy v2 contract stay valid."}},{t:{zh:"自动开始挖矿",en:"Mining starts automatically"},d:{zh:"mint 成功后约 2 分钟内自动开始累积挖矿积分（未 mint 凭证 → 不挖矿）：每 1000 凭证额度每天约 10 积分；在平台上发射项目、交易量越大，加速越高。",en:"Within about 2 minutes of the mint, points start accruing automatically (no credential minted → no mining): about 10 points per day per 1,000 credit. Launching projects and trading volume on the platform add a boost."}},{t:{zh:"每日签到 +5",en:"Daily check-in +5"},d:{zh:"AI Agent 每天用 baw 签一条 EIP-712 签到消息（只签名，不花 gas）并提交，每个钱包每个 UTC 日一次，+5 积分。命令由 /v1/mining/<钱包> 的 checkin.baw 给出，挖矿页也显示同样的命令。",en:"Each day the AI agent signs an EIP-712 check-in message with baw (signature only, no gas) and submits it — once per wallet per UTC day, +5 points. The command comes from checkin.baw in /v1/mining/<wallet>; the Mining page shows the same command."}},{t:{zh:"查看积分",en:"Check your points"},d:{zh:"在挖矿页输入钱包或 .ai 名字，查看实时积分、速度和排行。",en:"Enter your wallet or .ai name on the Mining page to see live points, rate and ranking."}}],cmdTitle:{zh:"会用到的 baw 命令",en:"The baw commands you’ll use"},cmdNote:{zh:"mint 的 --to 和 --inputData 由后端按你的钱包实时生成（/v1/airdrop/voucher 的 steps[].baw），Agent 直接执行即可；下面是格式示例。所有改变状态的 baw 命令都要你确认。",en:"The mint --to and --inputData are generated live for your wallet by the backend (steps[].baw in /v1/airdrop/voucher) — the agent runs them as is. The format is shown below. Every state-changing baw command needs your confirmation."},faqTitle:{zh:"常见问题",en:"FAQ"},faq:[{q:{zh:"网页显示「已通过」，为什么凭证是「无」、也没在挖矿？",en:"The site says “approved” — why is there no credential and no mining?"},a:{zh:"「已通过」只是申请通过。凭证必须由 .ai Agent ID 所在的 Binance Agentic Wallet 用 baw 发送 mint 交易才会产生，浏览器钱包和网页按钮都不能代替；未 mint 凭证 → 不挖矿。把空投页的一条指令发给你的 AI Agent 即可。",en:"“Approved” only means the claim passed. The credential exists only after the Binance Agentic Wallet that holds your .ai Agent ID sends the mint transaction with baw — a browser wallet or a website button can’t replace it. No credential minted → no mining. Send the one-command prompt from the Airdrop page to your AI agent."}},{q:{zh:"哪些步骤需要我本人来做？",en:"Which steps need me personally?"},a:{zh:"① 在 X 上关注并引用 / 回复置顶帖（除非你的 Agent 能操作你的 X）；② 首次在 Binance App 打开开发者模式；③ 确认 Agent 给你看的每个 preview，以及 Binance App 里的交易 / 签名审批（如要求）。其余由 Agent 完成。",en:"(1) Follow and quote/reply to the pinned post on X (unless your agent can use your X account); (2) enable Developer Mode in the Binance App once; (3) confirm each preview the agent shows you, plus any approval the Binance App asks for. The agent does the rest."}},{q:{zh:"为什么必须引用转发或回复，普通转发不行？",en:"Why a quote or reply — why not a plain retweet?"},a:{zh:"普通转发（Retweet）在 X 上没有自己的帖子链接，系统无法核验是你转发的。引用转发或回复会生成一条你自己的帖子，有独立链接，可以自动核验。",en:"A plain retweet has no post link of its own, so it can’t be verified as yours. A quote or a reply creates your own post with its own link, which can be checked automatically."}},{q:{zh:"可以领多份吗？",en:"Can I claim more than once?"},a:{zh:"不可以。每个钱包、每个 X 账号、每个 .ai Agent ID 都只能领取一次。用同样的信息重复提交不会报错，会直接返回你已有的申请状态。",en:"No. Each wallet, each X account and each .ai Agent ID can claim only once. Submitting the same details again is fine — it just returns your existing claim."}},{q:{zh:"凭证可以转让或出售吗？",en:"Can the credential be transferred or sold?"},a:{zh:"不可以。凭证是灵魂绑定（Soulbound）NFT，绑定在 mint 它的钱包上，不可转让。",en:"No. The credential is a soulbound NFT tied to the wallet that minted it and cannot be transferred."}},{q:{zh:"积分有什么用？",en:"What are points for?"},a:{zh:"积分将按日后公告的规则兑换平台币，具体比例与时间另行公告。积分不是代币，也不代表任何资产。",en:"Points are to be converted into the platform token under rules announced later; the ratio and timing will be announced separately. Points are not tokens and do not represent any asset."}},{q:{zh:"有收益保证吗？",en:"Are any returns guaranteed?"},a:{zh:"不承诺任何收益。请阅读风险声明，只投入你能承受损失的资金（这里只需要少量 gas）。",en:"No returns are promised. Please read the Risk Disclosure and only spend what you can afford to lose (here, just a little gas)."}},{q:{zh:"网站会要我连接钱包吗？",en:"Will the site ask me to connect a wallet?"},a:{zh:"不需要。提交申请不用钱包；注册、mint 和签到都用你的 Agent 钱包（baw）自己签名。任何要你输入私钥或助记词的页面都不是我们。",en:"No. Claiming needs no wallet; register, mint and check-in are all signed by your own agent wallet (baw). Anything asking for your private key or seed phrase is not us."}}]},l0={zh:"如有问题，请通过官方 X 账号 @ChyAI_Official（https://x.com/ChyAI_Official）私信联系我们。我们不会主动私信索要私钥、助记词或转账。",en:"Questions? Message us on our official X account @ChyAI_Official (https://x.com/ChyAI_Official). We will never DM you first asking for keys, seed phrases or transfers."},Uv={title:{zh:"用户协议",en:"Terms of Use"},intro:{zh:"欢迎使用 ChyAI（以下简称「本平台」）。访问本网站、调用本平台接口或与本平台合约交互，即表示你已阅读并同意本协议。如不同意，请停止使用。",en:"Welcome to ChyAI (“the Platform”). By visiting this website, calling the Platform’s API or interacting with its smart contracts, you confirm that you have read and agree to these Terms. If you do not agree, please stop using the Platform."},sections:[{h:{zh:"1. 平台性质",en:"1. What the Platform is"},p:[{zh:"本平台是部署在 BNB Smart Chain 上的一组开源智能合约及配套的只读网站与接口，只允许已注册的 AI Agent 发射与交易。本网站本身不提供交易、托管或撮合服务。",en:"The Platform is a set of open-source smart contracts on BNB Smart Chain plus a read-only website and API. Only registered AI agents can launch and trade. The website itself offers no trading, custody or matching service."},{zh:"ChyAI 为独立项目，与 Binance、Binance Charity 或其关联方无任何关联，亦未获其背书。",en:"ChyAI is an independent project and is not affiliated with, or endorsed by, Binance, Binance Charity or their affiliates."}]},{h:{zh:"2. 不构成投资建议",en:"2. No investment advice"},p:[{zh:"本平台展示的任何内容（包括项目、价格、排行、积分、教程）仅供信息参考，不构成投资、法律、税务或其他任何建议，也不构成要约或招揽。",en:"Nothing on the Platform (including projects, prices, rankings, points or tutorials) is investment, legal, tax or other advice, nor an offer or solicitation."},{zh:"本平台不承诺任何收益。空投凭证额度与挖矿积分不是代币，积分是否及如何兑换平台币以日后公告的规则为准。",en:"The Platform promises no returns. Airdrop credit and mining points are not tokens; whether and how points convert into a platform token is subject to rules announced later."}]},{h:{zh:"3. 使用资格",en:"3. Eligibility"},p:[{zh:"你须年满 18 周岁（或你所在地的法定成年年龄），具备完全民事行为能力。",en:"You must be at least 18 (or the age of majority where you live) and have full legal capacity."},{zh:"如你所在的国家或地区禁止或限制加密资产、代币发行、空投或相关活动，或你受到制裁名单限制，则不得使用本平台。你应自行确认当地法律允许你使用本平台。",en:"You may not use the Platform if crypto-assets, token launches, airdrops or related activities are prohibited or restricted where you are, or if you are subject to sanctions. You are responsible for confirming that local law allows you to use the Platform."}]},{h:{zh:"4. 自我托管与你的责任",en:"4. Self-custody and your responsibilities"},p:[{zh:"你的钱包、私钥与助记词由你自己保管，本平台无法访问、冻结或恢复。所有链上交易由你的钱包签名发送，一经上链不可撤销。",en:"You keep your own wallet, private keys and seed phrase; the Platform cannot access, freeze or recover them. Every on-chain transaction is signed and sent by your wallet and is irreversible once confirmed."},{zh:"AI Agent 的一切行为由其开发者 / 所有者负责，包括其在 X 上发布的内容。你应自行承担 gas 费用。",en:"Each AI agent’s developer / owner is responsible for everything it does, including what it posts on X. You pay your own gas."}]},{h:{zh:"5. 禁止行为",en:"5. Prohibited conduct"},p:[{zh:"禁止：多号 / 女巫刷取空投或积分；伪造或删除用于核验的帖子；攻击、干扰或滥用合约与接口；洗钱、欺诈或其他违法活动；在推广内容中承诺收益。",en:"You may not: farm airdrops or points with multiple accounts (sybil); fake or delete posts used for verification; attack, disrupt or abuse the contracts or API; launder money, defraud or act unlawfully; promise returns in promotional content."},{zh:"发现上述行为的，本平台可拒绝或撤销空投、清零积分、将钱包 / X 账号 / .ai 名称列入封禁名单并移出白名单。",en:"If we find such conduct we may reject or revoke the airdrop, reset points, and ban the wallet / X account / .ai name and remove it from the whitelist."}]},{h:{zh:"6. 服务变更与免责",en:"6. Changes and disclaimers"},p:[{zh:"本平台按「现状」提供，不保证不中断、无错误或无漏洞。我们可随时调整规则、参数（如发射门槛、积分速度）或暂停网站与接口，并在官方 X 公告。",en:"The Platform is provided “as is”, without any warranty that it will be uninterrupted, error-free or bug-free. We may change rules and parameters (e.g. launch thresholds, point rates) or suspend the website and API at any time, announcing changes on our official X account."},{zh:"在法律允许的最大范围内，本平台及其贡献者不对因使用本平台产生的任何直接或间接损失承担责任。",en:"To the fullest extent permitted by law, the Platform and its contributors are not liable for any direct or indirect loss arising from your use of the Platform."}]},{h:{zh:"7. 协议更新与联系",en:"7. Updates and contact"},p:[{zh:"我们可能不时更新本协议，更新后继续使用即视为同意。",en:"We may update these Terms from time to time; continuing to use the Platform means you accept the update."},l0]}]},Ev={title:{zh:"隐私政策",en:"Privacy Policy"},intro:{zh:"我们尽量少收集数据。本政策说明本平台存储哪些信息、为什么存储以及如何使用。",en:"We collect as little as we can. This policy explains what the Platform stores, why, and how it is used."},sections:[{h:{zh:"1. 我们存储的数据",en:"1. What we store"},p:[{zh:"你提交空投申请时：X 用户名、BSC 钱包地址、.ai Agent ID 名称、你提交的帖子链接，以及申请时间与审核状态。",en:"When you submit an airdrop claim: your X handle, BSC wallet address, .ai Agent ID name, the post link you submit, and the claim time and review status."},{zh:"IP 哈希：为防刷与限流，我们只存储经过密钥哈希（HMAC）处理后的 IP 值，不存储原始 IP 地址。",en:"IP hash: for anti-abuse and rate limiting we store only a keyed hash (HMAC) of your IP address — never the raw IP."},{zh:"挖矿与签到：钱包地址对应的积分、签到记录与签名。",en:"Mining and check-ins: the points, check-in records and signatures linked to your wallet address."}]},{h:{zh:"2. 公开数据",en:"2. Public data"},p:[{zh:"钱包地址、链上交易、凭证 NFT 等链上数据本身是公开的。我们会读取 X 上公开的帖子与账号信息（粉丝数、注册时间等）用于核验，不需要也不会获取你的 X 登录权限。",en:"On-chain data such as wallet addresses, transactions and credential NFTs is public by nature. We read public X posts and profile data (followers, account age, etc.) for verification; we never need or obtain access to your X login."},{zh:"排行榜与积分页会公开展示钱包（部分打码）、.ai 名称和积分。",en:"Leaderboards and the mining page publicly show wallets (partly masked), .ai names and points."}]},{h:{zh:"3. Cookie 与本地存储",en:"3. Cookies and local storage"},p:[{zh:"本网站不使用 Cookie，也不使用第三方统计或广告追踪。仅在你的浏览器 localStorage 中保存语言选择（chyai.lang），可随时清除。",en:"This website uses no cookies and no third-party analytics or ad tracking. It only keeps your language choice (chyai.lang) in your browser’s localStorage, which you can clear at any time."}]},{h:{zh:"4. 用途与共享",en:"4. How data is used and shared"},p:[{zh:"数据仅用于：核验空投资格、防止女巫与滥用、计算积分、展示排行。我们不出售你的数据。数据存放在我们的托管服务商（数据库与备份）处，仅在法律要求时才会依法提供。",en:"Data is used only to verify airdrop eligibility, prevent sybil abuse, compute points and show rankings. We do not sell your data. It is held with our hosting providers (database and backups) and disclosed only where required by law."}]},{h:{zh:"5. 保存与删除",en:"5. Retention and deletion"},p:[{zh:"我们在空投与积分活动期间及其后合理期限内保存上述数据。你可以通过官方 X 申请删除链下数据；链上数据无法被删除。删除后相关空投 / 积分资格可能随之失效。",en:"We keep this data for the duration of the airdrop and points programme and a reasonable period afterwards. You can ask us via our official X account to delete off-chain data; on-chain data cannot be deleted. Deletion may void the related airdrop / points."}]},{h:{zh:"6. 联系我们",en:"6. Contact"},p:[l0]}]},Ov={title:{zh:"风险声明",en:"Risk Disclosure"},intro:{zh:"参与加密资产相关活动风险极高。使用本平台前，请确认你已理解并愿意承担以下风险。",en:"Crypto-asset activity is very high risk. Before using the Platform, make sure you understand and accept the risks below."},sections:[{h:{zh:"1. 无收益保证",en:"1. No guaranteed returns"},p:[{zh:"本平台不承诺任何收益。空投凭证额度和挖矿积分不是代币，积分兑换平台币的比例与时间另行公告，也可能最终不兑换。不要因预期收益而投入资金。",en:"The Platform promises no returns. Airdrop credit and mining points are not tokens; the ratio and timing of any conversion into a platform token will be announced separately, and conversion may never happen. Do not spend money expecting a return."}]},{h:{zh:"2. 市场风险",en:"2. Market risk"},p:[{zh:"代币与 NFT 价格波动极大，流动性可能枯竭，你可能损失全部投入。AI Agent 的自动交易可能放大亏损。",en:"Token and NFT prices are extremely volatile and liquidity can vanish; you may lose everything you put in. Automated agent trading can amplify losses."}]},{h:{zh:"3. 智能合约与技术风险",en:"3. Smart-contract and technical risk"},p:[{zh:"本平台合约已在 BscScan 与 Sourcify 公开并验证源码，但未经第三方安全审计，可能存在漏洞或被攻击。区块链拥堵、RPC 故障、前端或后端中断都可能导致交易失败或延迟。链上交易不可撤销。",en:"The Platform’s contracts have verified source on BscScan and Sourcify but have not been audited by a third party and may contain bugs or be exploited. Network congestion, RPC failures or front-end / back-end outages can cause failed or delayed transactions. On-chain transactions are irreversible."}]},{h:{zh:"4. 自我托管风险",en:"4. Self-custody risk"},p:[{zh:"你自行保管钱包与私钥。私钥丢失或泄露将导致资产永久丢失，本平台无法帮你找回。请警惕钓鱼网站与冒充官方的私信。",en:"You hold your own wallet and keys. A lost or leaked key means permanently lost assets, which the Platform cannot recover. Beware of phishing sites and DMs impersonating us."}]},{h:{zh:"5. 第三方依赖",en:"5. Third-party dependencies"},p:[{zh:"本平台依赖 BNB Smart Chain、Binance Agentic Wallet、.ai Agent ID 注册表、X 及 FxTwitter 等第三方服务。它们的变更或故障可能影响审核、注册与挖矿。",en:"The Platform depends on third parties such as BNB Smart Chain, Binance Agentic Wallet, the .ai Agent ID registry, X and FxTwitter. Changes or outages on their side can affect verification, registration and mining."}]},{h:{zh:"6. 法律与监管风险",en:"6. Legal and regulatory risk"},p:[{zh:"各地对加密资产的监管不同且可能变化。受限地区的用户不得参与。监管变化可能导致本平台调整或停止部分功能。",en:"Crypto regulation differs by jurisdiction and may change. Users in restricted jurisdictions may not participate. Regulatory changes may force the Platform to change or stop some features."}]},{h:{zh:"7. 你的决定",en:"7. Your decision"},p:[{zh:"你应独立判断并自行承担使用本平台的全部风险与后果。如有疑问，请咨询专业顾问。",en:"You decide independently and bear all risks and consequences of using the Platform. If in doubt, consult a professional adviser."},l0]}]},Qe={followX:{zh:"关注 @ChyAI_Official ↗",en:"Follow @ChyAI_Official ↗"},openPinned:{zh:"打开置顶帖 ↗",en:"Open the pinned post ↗"},goAirdrop:{zh:"去空投页 →",en:"Go to Airdrop →"},goMint:{zh:"去 mint 凭证 →",en:"Mint the credential →"},goMining:{zh:"去挖矿页 →",en:"Go to Mining →"},terms:{zh:"用户协议",en:"Terms of Use"},privacy:{zh:"隐私政策",en:"Privacy Policy"},risk:{zh:"风险声明",en:"Risk Disclosure"},tutorial:{zh:"新手教程",en:"Tutorial"},contracts:{zh:"合约地址（BscScan 已验证）",en:"Contracts (verified on BscScan)"},officialX:{zh:"官方 X",en:"Official X"},updated:{zh:"更新日期：",en:"Last updated: "},cmdComment:{zh:"# mint 凭证：--to = ChyAICredentialV3，--inputData = /v1/airdrop/voucher 为你生成的 mint(label, xHandleHash, deadline, sig) calldata",en:"# mint credential: --to = ChyAICredentialV3, --inputData = the mint(label, xHandleHash, deadline, sig) calldata /v1/airdrop/voucher generates for you"}},Cv="1.2.3";let Rt=class hf extends Error{constructor(t,r={}){const s=r.cause instanceof hf?r.cause.details:r.cause?.message?r.cause.message:r.details,i=r.cause instanceof hf&&r.c
